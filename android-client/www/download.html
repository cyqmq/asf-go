<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0a0c10, #1a2332);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 20px; color: #e6edf3;
    }
    .container { max-width: 560px; width: 100%; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .sub { color: #8b949e; font-size: 13px; margin-bottom: 24px; }
    .card {
      background: #161b22; border: 1px solid #2a3342; border-radius: 16px;
      padding: 20px; margin-bottom: 16px;
    }
    .card h2 { font-size: 15px; margin-bottom: 12px; }
    .file-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #2a3342; font-size: 14px;
    }
    .file-row:last-of-type { border-bottom: none; }
    .file-name { font-family: monospace; color: #58a6ff; }
    .file-size { color: #8b949e; font-size: 12px; margin-left: 8px; }
    .file-left { display: flex; align-items: center; gap: 8px; }
    a.dl {
      background: #58a6ff; color: #0a0c10; text-decoration: none;
      font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 8px;
      transition: opacity 0.2s;
    }
    a.dl:hover { opacity: 0.85; }
    a.dl.main {
      display: block; text-align: center; padding: 14px; font-size: 15px;
      border-radius: 12px; margin-bottom: 12px;
    }
    .back { display: inline-block; color: #58a6ff; text-decoration: none; font-size: 13px; margin-top: 16px; }
    .hint { color: #8b949e; font-size: 12px; line-height: 1.7; margin-top: 10px; }
    .hint code { background: #1c2330; padding: 2px 6px; border-radius: 4px; color: #58a6ff; }

</head>
